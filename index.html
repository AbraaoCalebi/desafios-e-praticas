<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sucesso.html">
</head>
<body>
    <div id="prin">
        <h1>Dados Pessoais</h1>
        
        <input id="nome" type="text" placeholder="Nome">
        <input id="escol" type="text" placeholder="Nivel Escolar" >
        <input id="inst" type="text" placeholder="Nome da Instituição">

        <p></p>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" maxlength="11" placeholder="000.000.000-00">
        <input id="idade" type="number" placeholder="Qual a sua idade ?">
        <input id="loc" type="text" placeholder="Qual estado você mora ?">

        <div id="resultado" class="escondido">
            <p>ATENÇÃO: Voê não possui 18 anos ainda, volte quando for de maior!</p>
        </div>

        <input type="button" value="Enviar" id="enviar" onclick="enviar()">

    </div>
    <script>
        
        function enviar() {
            var nome = document.getElementById('nome').value;
            var escol = document.getElementById('escol').value;
            var inst = document.getElementById('inst').value;
            var cpf = document.getElementById('cpf').value;
            
            // Captura o elemento e converte o valor diretamente
            var idadeInput = document.getElementById('idade');
            var idade = Number(idadeInput.value);
            
            var loc = document.getElementById('loc').value;
            var res = document.getElementById('resultado');

            if (idade < 18) {
                // Usa ${idade} para exibir o número digitado
                document.getElementById("resultado").classList.remove("escondido");
            } else {
                // Redireciona para a página desejada
                window.location.href = `sucesso.html?nome=${encodeURIComponent(nome)}&idade=${idade}`; 
            }
        }
    </script>
</body>
</html>
